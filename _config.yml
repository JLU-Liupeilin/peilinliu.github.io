google_site_verification:
bing_site_verification:
baidu_site_verification:

author:
  name: "Peilin Liu"
  avatar: "images/peilinliu.jpg"
  bio: "Class of 2023 undergraduate student in the Excellent Engineer Program, College of Software, Jilin University. My research interests include embodied intelligence, large language models, multimodal spatial understanding, recommender systems, federated learning, and time-series forecasting."
  location: "Jilin, China"
  employer: "Jilin University"
  pubmed:
  googlescholar: "https://scholar.google.com/citations?user=CEom0AEAAAAJ&hl=en"
  email: "liupl9922@mails.jlu.edu.cn"
  researchgate:
  uri:
  bitbucket:
  codepen:
  dribbble:
  flickr:
  facebook:
  foursquare:
